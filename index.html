<!-- Financial Summary Metric Widgets Log -->
<div class="metrics-grid">
    <div>Monthly Income: <span id="sumIncome">₹0.00</span></div>
    <div>Monthly Expenses: <span id="sumExpenses">₹0.00</span></div>
    <div>Monthly Savings: <span id="sumSavings">₹0.00</span></div>
    <div>Cash Balance: <span id="sumCashBalance">₹0.00</span></div>
    <div id="percentageSpentText">Percentage of Income Spent: 0.0000</div>
</div>

<!-- ➕ INCOME FORM TEMPLATE GRID EXAMPLE -->
<div id="tabContentincome" class="tab-page active-page">
    <h3>Add Income Transaction</h3>
    <input type="text" id="incSource" placeholder="Income Source (e.g. Salary)">
    <input type="number" id="incAmount" placeholder="Amount (₹)">
    <input type="date" id="incDate">
    <button onclick="commitRowItem('income')">Insert Row</button>

    <table>
        <thead>
            <tr><th>Srno.</th><th>Income Source</th><th>Date</th><th>Amount</th><th>Action</th></tr>
        </thead>
        <tbody id="incomeTableBody"></tbody>
    </table>
</div>

<!-- 📂 BANK STATEMENT OFFLINE CSV FILE PARSER ELEMENT -->
<div class="import-block">
    <label for="bankStatementFile">Import Bank Statement (CSV File):</label>
    <input type="file" id="bankStatementFile" accept=".csv" onchange="importBankStatementFile(event)">
</div>

<!-- Load your GitHub app.js Sync Script at the very bottom -->
<script src="app.js"></script>
