<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Budget Tracker</title>
    
    <!-- 🎨 EMBEDDED INTERNAL MASTER STYLESHEET LAYER -->
    <style>
        :root {
            --primary: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            padding: 20px;
            line-height: 1.5;
        }

        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--surface);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
        }

        .header-nav {
            max-width: 1200px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #cbd5e1;
            padding: 16px 24px;
            border-radius: 12px;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .tab-trigger {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text);
            transition: all 0.2s ease;
        }

        .tab-trigger:hover {
            background: #f1f5f9;
        }

        .tab-trigger.active-tab {
            background: #fef08a;
            border-color: #eab308;
        }

        .tab-page {
            display: none;
        }

        .tab-page.active-page {
            display: block;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 12px;
        }

        .metric-card {
            background: var(--surface);
            padding: 20px;
            border-radius: 10px;
            border-left: 5px solid #cbd5e1;
            box-shadow: 0 1px 3px rgb(0 0 0 / 0.1);
        }

        .income-card { border-left-color: var(--success); background: #f0fdf4; }
        .expense-card { border-left-color: var(--danger); background: #fdf2f8; }
        .savings-card { border-left-color: var(--primary); background: #eff6ff; }
        .balance-card { border-left-color: #f97316; background: #fff7ed; }

        .metric-card small {
            font-size: 0.75rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .metric-card h2 {
            font-size: 1.75rem;
            margin-top: 4px;
            font-weight: 700;
        }

        .ratio-bar-text {
            margin-top: 12px;
            font-size: 0.9rem;
            color: #64748b;
            font-weight: 500;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 12px;
            margin: 16px 0;
        }

        .check-card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 2px rgb(0 0 0 / 0.02);
        }

        .check-card label {
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .txt-red { color: var(--danger); font-size: 0.85rem; margin-top: 2px;}

        .check-card input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)) auto;
            gap: 12px;
            background: #f8fafc;
            padding: 16px;
            border-radius: 8px;
            margin: 16px 0;
            border: 1px solid var(--border);
        }

        input, select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            background: var(--surface);
        }

        .btn-primary { background: #2563eb; color: white; border: none; font-weight: 600; padding: 10px 24px; border-radius: 6px; cursor: pointer;}
        .btn-primary:hover { background: #1d4ed8; }
        .btn-success { background: #10b981; color: white; border: none; font-weight: 600; padding: 14px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1rem; text-transform: uppercase;}
        .btn-success:hover { background: #059669; }
        .btn-success:disabled, .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        th {
            background: #f1f5f9;
            color: #475569;
            text-align: left;
            padding: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }

        tr:hover { background: #f8fafc; }
        .txt-right { text-align: right; font-weight: 600; }

        .del-cross {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .del-cross:hover { color: var(--danger); }

        .import-block {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px dashed var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .import-block input { width: auto; border: none; padding: 0; background: none;}
    </style>
</head>
<body>
        <!-- ==========================================================================
             ➕ TAB PANEL 2: INCOME ENTRIES PANEL (FIXED CLOSURE)
             ========================================================================== -->
        <div id="tabContentincome" class="tab-page">
            <h4>Monthly Income Sheet Entries:</h4>
            <div class="form-grid">
                <input type="text" id="incSource" placeholder="Income Source (e.g. Salary)">
                <input type="date" id="incDate">
                <input type="number" id="incAmount" placeholder="Amount (₹)">
                <button class="btn-primary" onclick="commitRowItem('income')">Insert Row</button>
            </div>
            <table>
                <thead>
                    <tr><th>Srno.</th><th>Income Source</th><th>Date</th><th>Day</th><th>Amount</th><th>Month</th><th>Action</th></tr>
                </thead>
                <tbody id="incomeTableBody"></tbody>
            </table>
        </div>

        <!-- ==========================================================================
             💸 TAB PANEL 3: EXPENSE ENTRIES PANEL (FIXED CLOSURE)
             ========================================================================== -->
        <div id="tabContentexpense" class="tab-page">
            <h4>Monthly Expenses Sheet Entries:</h4>
            <div class="form-grid">
                <input type="text" id="expSource" placeholder="Expense Item">
                <select id="expCategory">
                    <option value="Misc">Misc</option>
                    <option value="Food">Food</option>
                    <option value="Rent">Rent</option>
                    <option value="Bill">Bill</option>
                </select>
                <input type="date" id="expDate">
                <input type="number" id="expAmount" placeholder="Amount (₹)">
                <button class="btn-primary" onclick="commitRowItem('expense')">Insert Row</button>
            </div>
            <table>
                <thead>
                    <tr><th>Srno.</th><th>Expense Source</th><th>Category</th><th>Date</th><th>Day</th><th>Amount</th><th>Month2</th><th>Action</th></tr>
                </thead>
                <tbody id="expensesTableBody"></tbody>
            </table>
        </div>

        <!-- ==========================================================================
             🐖 TAB PANEL 4: SAVINGS ENTRIES PANEL (FIXED CLOSURE)
             ========================================================================== -->
        <div id="tabContentsavings" class="tab-page">
            <h4>Monthly Savings Sheet Entries:</h4>
            <div class="form-grid">
                <input type="text" id="savSource" placeholder="Savings Target">
                <input type="date" id="savDate">
                <input type="number" id="savAmount" placeholder="Amount (₹)">
                <button class="btn-primary" onclick="commitRowItem('savings')">Insert Row</button>
            </div>
            <table>
                <thead>
                    <tr><th>Srno.</th><th>Savings Source</th><th>Date</th><th>Day</th><th>Amount</th><th>Month</th><th>Action</th></tr>
                </thead>
                <tbody id="savingsTableBody"></tbody>
            </table>
        </div>

        <!-- ==========================================================================
             📂 GLOBAL BANK STATEMENT OFFLINE STATEMENT IMPORT ENGINE
             ========================================================================== -->
        <div class="import-block">
            <label for="bankStatementFile"><strong>Import Bank Statement (CSV File):</strong></label>
            <input type="file" id="bankStatementFile" accept=".csv" onchange="importBankStatementFile(event)">
        </div>

    </div>

    <!-- Calls your structural JavaScript logic engine components -->
    <script src="app.js"></script>
</body>
</html>
